# ============================================================================
# GYMGUIDE - PRODUCTION-READY DOCKER COMPOSE CONFIGURATION
# Runs PostgreSQL, MinIO Object Storage, NestJS Backend, and React Frontend
# Launch command: docker compose up --build
# ============================================================================

services:
  # 1. PostgreSQL Database Container (Isolated on internal network - stores relational data & media metadata)
  postgres:
    image: postgres:16-alpine
    container_name: gymguide-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gymguide_db}
      POSTGRES_USER: ${POSTGRES_USER:-gymguide_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-GymGuide_StrongDbPass_2026!}
    volumes:
      - gymguide_pgdata:/var/lib/postgresql/data
    networks:
      - gymguide_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gymguide_app} -d ${POSTGRES_DB:-gymguide_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  # 2. MinIO S3-Compatible Object Storage Container (Stores all exercise videos & WebP step images privately)
  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    container_name: gymguide-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-gymguide_minio_dev}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-GymGuide_MinioSecret_2026!}
      MINIO_REGION_NAME: ${MINIO_REGION:-us-east-1}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - gymguide_minio_data:/data
    networks:
      - gymguide_internal
      - gymguide_edge
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || mc ready local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true

  # 3. NestJS Backend API Container (JavaScript ES6+, Prisma ORM & MinIO S3 Client)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gymguide-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      API_PREFIX: api/v1
      DATABASE_URL: postgresql://${POSTGRES_USER:-gymguide_app}:${POSTGRES_PASSWORD:-GymGuide_StrongDbPass_2026!}@postgres:5432/${POSTGRES_DB:-gymguide_db}?schema=public
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      RATE_LIMIT_TTL_MS: ${RATE_LIMIT_TTL_MS:-60000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-150}
      BODY_LIMIT_KB: ${BODY_LIMIT_KB:-100}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-GymGuideProdAccessSecret_9f8e7d6c5b4a3f2e1d0c9b8a7f6e5d4c}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-GymGuideProdRefreshSecret_1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_CONSOLE_PORT: ${MINIO_CONSOLE_PORT:-9001}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-gymguide_minio_dev}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-GymGuide_MinioSecret_2026!}
      MINIO_BUCKET: ${MINIO_BUCKET:-gymguide-media}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_PRESIGNED_EXPIRY_SEC: ${MINIO_PRESIGNED_EXPIRY_SEC:-900}
      MEDIA_STREAM_SECRET: ${MEDIA_STREAM_SECRET:-GymGuideMediaStreamSecret_9f8e7d6c5b4a3f2e}
      MAX_IMAGE_UPLOAD_MB: ${MAX_IMAGE_UPLOAD_MB:-10}
      MAX_VIDEO_UPLOAD_MB: ${MAX_VIDEO_UPLOAD_MB:-100}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@gymguide.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-GymGuideAdmin#2026}
    ports:
      - "4000:4000"
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - gymguide_internal
      - gymguide_edge
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/v1/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 25s
    security_opt:
      - no-new-privileges:true

  # 4. React + Vite + Nginx Unprivileged Frontend Container
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: gymguide-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - gymguide_edge
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true

volumes:
  gymguide_pgdata:
    name: gymguide_pgdata
  gymguide_minio_data:
    name: gymguide_minio_data

networks:
  gymguide_internal:
    driver: bridge
    internal: true
  gymguide_edge:
    driver: bridge
