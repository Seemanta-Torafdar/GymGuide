# ============================================================================
# GYMGUIDE - PRODUCTION-READY DOCKER COMPOSE CONFIGURATION
# Runs separate PostgreSQL, NestJS Backend, and React Frontend containers
# Launch command: docker compose up --build
# ============================================================================

services:
  # 1. PostgreSQL Database Container (Isolated on internal network - not exposed publicly)
  postgres:
    image: postgres:16-alpine
    container_name: gymguide-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gymguide_db}
      POSTGRES_USER: ${POSTGRES_USER:-gymguide_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-GymGuide_StrongDbPass_2026!}
    volumes:
      - gymguide_pgdata:/var/lib/postgresql/data
    networks:
      - gymguide_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gymguide_app} -d ${POSTGRES_DB:-gymguide_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  # 2. NestJS Backend API Container (JavaScript ES6+ & Prisma ORM)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gymguide-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      API_PREFIX: api/v1
      DATABASE_URL: postgresql://${POSTGRES_USER:-gymguide_app}:${POSTGRES_PASSWORD:-GymGuide_StrongDbPass_2026!}@postgres:5432/${POSTGRES_DB:-gymguide_db}?schema=public
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      RATE_LIMIT_TTL_MS: ${RATE_LIMIT_TTL_MS:-60000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-150}
      BODY_LIMIT_KB: ${BODY_LIMIT_KB:-100}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-GymGuideProdAccessSecret_9f8e7d6c5b4a3f2e1d0c9b8a7f6e5d4c}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-GymGuideProdRefreshSecret_1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
    ports:
      - "4000:4000"
    networks:
      - gymguide_internal
      - gymguide_edge
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/v1/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 25s
    security_opt:
      - no-new-privileges:true

  # 3. React + Vite + Nginx Unprivileged Frontend Container
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: gymguide-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - gymguide_edge
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true

volumes:
  gymguide_pgdata:
    name: gymguide_pgdata

networks:
  gymguide_internal:
    driver: bridge
    internal: true
  gymguide_edge:
    driver: bridge
